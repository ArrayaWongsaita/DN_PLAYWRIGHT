# ไฟล์ workflow ของ GitHub Actions ที่เติมครบแล้ว (เฉลย) ยังไม่ทำงานที่ไหน เพราะไม่ได้อยู่ใน .github/workflows
# เมื่อใช้จริงในโปรเจกต์ของตัวเอง ให้ copy ไปไว้ที่ .github/workflows/playwright.yml
name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # false = ถ้า shard หนึ่งล้ม shard อื่นยังรันต่อจนจบ (เห็นผลครบทุกชิ้น)
      fail-fast: false
      matrix:
        # ข้อ 6: GitHub สร้าง job หนึ่งตัวต่อค่าในรายการนี้ ตัวแรก matrix.shard = 1 ตัวที่สอง = 2 (ต้องเท่ากับตัวหารใน --shard=N/2)
        shard: [1, 2]
    steps:
      # ดึงโค้ดของ repo มาที่เครื่อง runner
      - uses: actions/checkout@v7

      # ข้อ 1: ติดตั้ง pnpm ต้องมาก่อน setup-node เพราะ cache: pnpm ต้องเรียกคำสั่ง pnpm ได้
      # ไม่ใส่ version เพราะ action อ่านจาก packageManager ใน package.json (จึงตรงกับเครื่องเราเสมอ)
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # ข้อ 2: ตรงกับ engines.node (>=24) และ .nvmrc ของ repo
          node-version: 24
          # เก็บ cache ของ pnpm เพื่อให้ติดตั้งเร็วขึ้นในรอบถัดไป
          cache: pnpm

      # ข้อ 3: ติดตั้งตาม pnpm-lock.yaml เป๊ะๆ ถ้า lockfile ไม่ตรงกับ package.json จะล้มแทนที่จะแก้เงียบๆ
      - run: pnpm install --frozen-lockfile

      # ข้อ 4: ติดตั้งเฉพาะ chromium (เร็วกว่าลงทุก browser) --with-deps ลงไลบรารีของระบบที่ browser ต้องใช้บน Linux
      - run: pnpm exec playwright install --with-deps chromium

      # ข้อ 5: รันเฉพาะส่วนของ job นี้ job แรกได้ --shard=1/2 job ที่สองได้ --shard=2/2
      - run: pnpm test --config lessons/51-ci-github-actions/playwright.config.ts --shard=${{ matrix.shard }}/2

      # อัปโหลดรายงานเก็บไว้ดูหลังจบ (ชื่อ artifact ต้องไม่ซ้ำกันระหว่าง shard)
      # if: ${{ !cancelled() }} = อัปโหลดแม้ test จะล้ม (แต่ไม่อัปโหลดถ้ากดยกเลิก)
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.shard }}
          path: lessons/51-ci-github-actions/output/
          retention-days: 7
